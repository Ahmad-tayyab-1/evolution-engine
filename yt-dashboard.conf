server {
    listen 80;
    server_name _;
    server_tokens off;

    # Strip ALL identifying headers
    more_clear_headers Server;
    more_clear_headers X-Powered-By;
    more_clear_headers X-Runtime;
    more_clear_headers X-Version;
    more_clear_headers X-AspNet-Version;
    more_clear_headers X-Generator;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Custom blank error pages — reveal nothing
    error_page 400 401 403 404 405 408 500 502 503 504 /err.html;
    location = /err.html {
        root /var/www/yt-agent/dashboard/static;
        internal;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
        proxy_buffering on;
        proxy_connect_timeout 10;
        proxy_read_timeout 30;
    }
}
