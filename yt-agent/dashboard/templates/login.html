<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif}
        body{background:#050608;color:#f1f5f9;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
        .o{position:absolute;border-radius:50%;filter:blur(140px);opacity:.2;z-index:0;animation:d 14s ease-in-out infinite alternate}
        .oa{width:400px;height:400px;background:#6366f1;top:-8%;left:-6%}
        .ob{width:360px;height:360px;background:#06b6d4;bottom:-10%;right:-8%;animation-delay:-7s}
        @keyframes d{0%{transform:translate(0,0) scale(1)}100%{transform:translate(50px,30px) scale(1.1)}}
        .c{position:relative;z-index:10;width:100%;max-width:380px;padding:40px 34px;background:rgba(14,17,26,.82);border:1px solid rgba(255,255,255,.06);border-radius:22px;backdrop-filter:blur(24px);box-shadow:0 30px 60px -20px rgba(0,0,0,.7);animation:a .5s cubic-bezier(.16,1,.3,1)}
        @keyframes a{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
        h1{text-align:center;font-size:20px;font-weight:600;margin-bottom:28px;letter-spacing:-.2px}
        .f{margin-bottom:18px}
        label{display:block;font-size:12px;font-weight:600;color:#94a3b8;margin-bottom:6px}
        input{width:100%;padding:12px 15px;background:rgba(8,10,18,.8);border:1px solid rgba(255,255,255,.1);border-radius:10px;color:#fff;font-size:14px;outline:none;transition:border-color .25s,box-shadow .25s}
        input:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.15)}
        .b{width:100%;padding:13px;margin-top:6px;background:linear-gradient(135deg,#6366f1,#06b6d4);border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:0 6px 18px rgba(99,102,241,.25)}
        .b:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(99,102,241,.4)}
        .b:active{transform:translateY(0)}
        .e{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#fca5a5;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;text-align:center;animation:s .35s ease}
        @keyframes s{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
    </style>
</head>
<body>
    <div class="o oa"></div>
    <div class="o ob"></div>
    <div class="c">
        <h1>Sign In</h1>
        {% if error %}
        <div class="e">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/login" autocomplete="off">
            <div class="f">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="f">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="b">Sign In</button>
        </form>
    </div>
</body>
</html>
